<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Convert a bank statement — TaxNest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="bank-recon-landing.css">
<link rel="stylesheet" href="bank-recon-review.css">
<link rel="stylesheet" href="taxnest-theme.css">
<link rel="icon" type="image/png" href="assets/favicon.png">
</head>
<body>

<canvas id="fx-bg" aria-hidden="true"></canvas>
<header class="site-bar">
  <img class="brand-logo" src="assets/taxnest-logo-192.png" alt="TaxNest logo" width="46" height="46">
  <span class="wordmark">Tax<b>Nest</b></span>
  <span class="site-bar-sub">Bank Import &middot; GST &bull; TDS &bull; Bookkeeping</span>
  <button type="button" class="fx-toggle" id="fx-toggle" title="Turn background animations on or off">&#10022; Effects on</button>
</header>

<main class="sheet-wrap">
  <div class="sheet">
    <div class="sheet-margin" aria-hidden="true"></div>
    <div class="sheet-content">

      <img class="hero-logo" src="assets/taxnest-logo-192.png" alt="" width="104" height="104">
      <h1>Convert a bank statement</h1>
      <p class="lede">Pick the bank, then upload the PDF. Extraction, validation and ledger review happen in the next step. Your statement is read in your browser and is not uploaded anywhere.</p>

      <div class="field">
        <label for="bank-input">Bank</label>
        <div class="combobox" id="bank-combobox">
          <input
            type="text"
            id="bank-input"
            placeholder="Search or select a bank"
            autocomplete="off"
            role="combobox"
            aria-expanded="false"
            aria-controls="bank-listbox"
            aria-autocomplete="list"
          >
          <button type="button" class="combobox-toggle" id="bank-toggle" aria-label="Show bank list">▾</button>
          <ul class="combobox-list" id="bank-listbox" role="listbox" hidden></ul>
        </div>
      </div>

      <div class="divider"></div>

      <div class="field">
        <label id="dropzone-label">Statement PDF</label>
        <div class="dropzone" id="dropzone" aria-labelledby="dropzone-label">
          <input type="file" id="file-input" accept="application/pdf" hidden>

          <div class="dropzone-empty" id="dropzone-empty">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
              <path d="M12 15V4M12 4l-4 4M12 4l4 4" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <p>Drop the PDF here, or</p>
            <button type="button" class="btn-choose" id="choose-file-btn">Choose file</button>
          </div>

          <div class="dropzone-file" id="dropzone-file" hidden>
            <span class="file-badge">PDF</span>
            <span class="file-name" id="file-name"></span>
            <span class="file-size" id="file-size"></span>
            <span class="file-check" aria-hidden="true">✓</span>
            <button type="button" class="file-remove" id="file-remove">Remove</button>
          </div>
        </div>
        <p class="hint" id="file-hint" hidden></p>
      </div>

      <button type="button" class="btn-continue" id="continue-btn" disabled>Continue</button>
      <p class="note" id="continue-note" hidden></p>

    </div>
  </div>
</main>

<main class="sheet-wrap" id="step-2" hidden>
  <div class="sheet sheet-wide">
    <div class="sheet-margin" aria-hidden="true"></div>
    <div class="sheet-content" id="rv-root"></div>
  </div>
</main>

<script src="bank-list.js"></script>
<script src="bank-recon-landing.js"></script>

<!-- Parsing + Tally XML engine -->
<script src="bank-parser-core.js"></script>
<script src="parser-kotak-mahindra.js"></script>
<script src="parser-bandhan-bank.js"></script>
<script src="tally-xml-builder.js"></script>
<script src="universal-parser.js"></script>
<script src="balance-validator.js"></script>
<script src="mapping-engine.js"></script>
<script src="smart-mapping.js"></script>
<script src="ledger-import.js"></script>

<!-- pdf.js -- pinned to 3.11.174, the last release with a classic (non-module)
     build, so it drops in as a plain <script> alongside everything else here.
     Newer pdf.js (4.x+) ships ES-modules-only and would need type="module". -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
</script>

<!-- SheetJS (Excel export). Pinned; loaded from cdnjs like pdf.js. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script src="fx.js"></script>
<script src="bank-recon-review.js"></script>
<script src="bank-recon-extract.js"></script>
</body>
</html>
